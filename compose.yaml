services:
  dev:
    image: node:24-bookworm-slim
    working_dir: /app
    ports:
      - "127.0.0.1:5183:5173"
    volumes:
      - .:/app
      - dependencies:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --port 5173 --strictPort"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      default:
        aliases: [scooter-app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
  production:
    profiles: [production]
    build: .
    ports:
      - "127.0.0.1:8083:80"
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app
    volumes:
      - ./test-results:/app/test-results
    environment:
      BASE_URL: http://scooter-app:5173
    depends_on:
      dev:
        condition: service_healthy
volumes:
  dependencies:
